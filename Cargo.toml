[package]
name = "vactrol"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Vactrol scripting language"

homepage = "https://github.com/tacogips/vactrol"
repository = "https://github.com/tacogips/vactrol"
license = "MIT"
readme = "README.md"

[features]
default = ["host-native"]
host-native = ["dep:cpal", "dep:midir"]
host-wasm = []
lsp = []

[dependencies]

# Native-only host crates (design 12.8.10): never compiled for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.16", optional = true }
midir = { version = "0.10", optional = true }

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "vactrol"
path = "src/main.rs"

[lib]
name = "vactrol"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[example]]
name = "beep"
path = "examples/beep.rs"
required-features = ["host-native"]
