[package]
name = "vactr"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
description = "Vactr scripting language"

homepage = "https://github.com/tacogips/vactr"
repository = "https://github.com/tacogips/vactr"
license = "MIT"
readme = "README.md"

[features]
default = ["host-native"]
host-native = ["dep:cpal", "dep:midir", "dep:tungstenite", "dep:getrandom"]
host-wasm = []
# The LSP attach client uses the session socket client (tungstenite), so
# `lsp` implies `host-native` (design 14.5.2).
lsp = ["host-native", "dep:tower-lsp", "dep:tokio"]

# Core dependencies (design 14.5.2): wasm32-clean.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = "0.9"

# Native-only host crates (design 12.8.10): never compiled for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.16", optional = true }
midir = { version = "0.10", optional = true }
# Session socket and token (`host-native`), `vactr lsp` (`lsp`); 14.5.2.
tungstenite = { version = "0.29", optional = true }
getrandom = { version = "0.3", optional = true }
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "io-std", "macros", "sync"] }

[dev-dependencies]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "vactr"
path = "src/main.rs"

[lib]
name = "vactr"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[example]]
name = "beep"
path = "examples/beep.rs"
required-features = ["host-native"]
