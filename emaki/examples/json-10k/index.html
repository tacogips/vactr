<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON editor</title><link rel="stylesheet" href="../shared/demo.css">
  <style>
    html, body { margin: 0; height: 100%; }
    main { box-sizing: border-box; height: 100%; display: flex; flex-direction: column; gap: var(--emaki-space-2); }
    header { display: flex; align-items: center; gap: var(--emaki-space-3); flex-wrap: wrap; }
    h1 { font-size: 1rem; margin: 0; }
    #line-count { color: var(--emaki-muted); }
    button { background: var(--emaki-panel); color: var(--emaki-text); border: 1px solid var(--emaki-muted); padding: 8px 12px; cursor: pointer; }
    button[aria-pressed="true"] { border-color: var(--emaki-accent); color: var(--emaki-accent); }
    #editor { flex: 1; min-height: 0; }
  </style>
</head>
<body><main>
  <header><h1>JSON editor</h1><span id="line-count"></span><nav aria-label="Fixture size">
    <button type="button" data-lines="1000">1k</button><button type="button" data-lines="10000">10k</button><button type="button" data-lines="100000">100k</button>
  </nav></header>
  <div id="editor"></div>
</main><script type="module" src="./main.ts"></script></body>
</html>
