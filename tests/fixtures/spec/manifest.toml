# Spec fixture manifest (design 6.5.6). Parsed by tests/support/toml_subset.rs.
# [[block]]: one entry per `vactrol`/`vact` fence, found by ordinal per document;
#   reader_diags is the exact multiset of reader codes, `code@line` with the line
#   counted within the block. `expand_diags` is the exact multiset of expander codes,
#   `code@line`; forms with a reader error are skipped (the runner asserts that they
#   return read-error-present) and are not listed. `eval` is the 7.1.7 class:
#   positive and diagnostic blocks pin `check_diags` (errors and warnings of checking
#   the block as one document, `code@line`) and `run_fails` (failing forms,
#   `code@first line`, one fresh Evaluator); deferred blocks name `deferred_to` and
#   pin `check_diags` when `pin_check`; `blocked_by` + `defect_run_fails` mark
#   failures caused only by a recorded implementation defect (asserted to reproduce
#   exactly, so the repair must update them).
# [[case]]: `read` and `expand` are canonical prints (src/reader/sexpr.rs) joined by
#   newlines; `diags` is the multiset of reader codes plus expander codes (a case with
#   an expander diagnostic has no `expand`); `verbatim = true` means `source` appears
#   verbatim in `doc`.

