note = "Patterns. The chord line writes `[:g :dom7]` as in section 2, and Tidal's `struct` is spelled `grid` (design 20 Q3, Decided 2026-09-25). Eval: The SOUND FIRST chains, sinks, transforms, control patterns, combinators, signals and `grid` all run. Codes: `pat` is a placeholder name (undefined-name@82-90); the signal listing line `sine  saw ..` is a call (type-mismatch@93, not-callable); the lines ending `> s :piano` (@100, @106) and `> s :sawtooth` (@103) predate the Decided SOUND FIRST rule of section 1, so they are sound-not-first (arity at run time); `off {note [..]} ..` and `arp {chord [..]} :up` give a control no subject (type-mismatch, arity)."

