doc = "lang-reference.md"
file = "file"
verbatim = false
source = '''
import github.com/someone/vactrol-pads as pd
note [:c3] > s pd.warm > d1'''
read = '''
(#import "github.com/someone/vactrol-pads" as pd)
(d1 (s (note [:c3]) pd.warm))'''
expand = '''
(#import "github.com/someone/vactrol-pads" as pd)
(d1 (s (note [:c3]) pd.warm))'''
diags = []

[[case]]
id = "unbound-qualifier"
doc = "lang-reference.md"
file = "file"
verbatim = true
source = 'note [:c3] > s pads.warm > d1'
read = '(#error)'
diags = ["unbound-qualifier"]
note = "Read with no import before it: the qualifier is unbound."

[[case]]
id = "directive-trivia"
doc = "lang-reference.md"
file = "file"
verbatim = false
source = '''
#@ panel: gain
let g 1'''
read = '(let g 1)'
expand = '(let g 1)'
diags = []
note = "`#@` lines are trivia with spans (unit tests check the spans)."

[[case]]
id = "u5-bare-variant-binding-if"
doc = "lang-reference.md"
file = "file"
verbatim = false
source = 'if x none -> 1'
read = '(-> (if x none) 1)'
expand = '(match x {(-> (false | nil) nil) (-> (none) 1)})'
diags = []
note = "U5 (answered): the expander keeps the syntactic binding-if desugaring. When `none` is a field-less variant, a truthy value that is not `none` fails the match instead of taking the else branch; the checker (TASK-004) must diagnose a bare field-less variant used as the binding pattern of `if`. The expander implements no such diagnostic."
